<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-journal-text me-2 text-primary"></i>Auditoria
        </h2>
        <span class="text-muted small">Registros somente leitura — não podem ser alterados ou excluídos.</span>
    </div>

    <!-- Filtros -->
    <form th:action="@{/auditoria}" method="get" class="card card-body shadow-sm mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-md-2">
                <label class="form-label small mb-1" for="entidade">Entidade</label>
                <select id="entidade" name="entidade" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option th:each="e : ${ {'PEDIDO','CLIENTE','USUARIO','SISTEMA'} }" th:value="${e}" th:text="${e}"
                            th:selected="${e == entidade}"></option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1" for="entidadeId">Identificador</label>
                <input id="entidadeId" name="entidadeId" class="form-control form-control-sm" th:value="${entidadeId}">
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1" for="usuario">Usuário</label>
                <input id="usuario" name="usuario" class="form-control form-control-sm" th:value="${usuario}">
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1" for="operacao">Operação</label>
                <select id="operacao" name="operacao" class="form-select form-select-sm">
                    <option value="">Todas</option>
                    <option th:each="o : ${operacoes}" th:value="${o}" th:text="${o.descricao}"
                            th:selected="${o == operacao}"></option>
                </select>
            </div>
            <div class="col-md-2 d-flex gap-1">
                <button type="submit" class="btn btn-primary btn-sm w-100"><i class="bi bi-funnel"></i> Filtrar</button>
                <a th:href="@{/auditoria}" class="btn btn-outline-secondary btn-sm">Limpar</a>
            </div>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 small">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Data e hora</th>
                        <th>Usuário</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Campo alterado</th>
                        <th>Valor anterior</th>
                        <th>Novo valor</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="8" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum registro encontrado.
                        </td>
                    </tr>
                    <th:block th:each="r : ${registros}">
                        <!-- Uma linha por campo alterado (ou uma linha se não houver campos) -->
                        <tr th:each="a, st : ${#lists.isEmpty(r.alteracoes) ? {null} : r.alteracoes}">
                            <td class="ps-3 text-nowrap" th:text="${st.first} ? ${#temporals.format(r.dataHora, 'dd/MM/yyyy — HH:mm:ss')} : ''"></td>
                            <td th:if="${st.first}">
                                <span th:text="${r.usuario}"></span>
                                <span class="badge bg-secondary" th:text="${r.perfil}"></span>
                            </td>
                            <td th:unless="${st.first}"></td>
                            <td th:text="${st.first} ? ${r.operacao.descricao} : ''"></td>
                            <td th:if="${st.first}">
                                <a th:if="${r.entidade == 'PEDIDO'}" th:href="@{/pedidos/{id}(id=${r.entidadeId})}"
                                   th:text="${r.entidade} + ' ' + ${r.entidadeId}"></a>
                                <span th:unless="${r.entidade == 'PEDIDO'}" th:text="${r.entidade} + ' ' + ${r.entidadeId}"></span>
                            </td>
                            <td th:unless="${st.first}"></td>
                            <td><code th:if="${a != null}" th:text="${a.campo}"></code></td>
                            <td class="text-muted" th:text="${a != null} ? ${a.valorAnterior ?: '—'} : ''"></td>
                            <td th:text="${a != null} ? ${a.valorNovo ?: '—'} : ''"></td>
                            <td class="fst-italic" th:text="${st.first} ? ${r.justificativa} : ''"></td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
            </div>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(registros)}">
            <strong th:text="${#lists.size(registros)}"></strong> evento(s) — exibindo os mais recentes primeiro (máx. 500).
        </div>
    </div>

</div>

</body>
</html>
