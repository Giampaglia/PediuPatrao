<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <!-- Os itens são ocultados conforme o perfil apenas por conveniência:
             a permissão real é verificada no backend (SecurityConfig / @PreAuthorize). -->
        <div th:fragment="sidebar">
            <div id="sidebar">
                <h4 class="text-center py-3">Pediu Patrão</h4>

                <div class="text-center small mb-3 px-2" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name"></span>
                    <span class="badge bg-danger" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                    <span class="badge bg-warning text-dark" sec:authorize="hasRole('GERENTE')">GERENTE</span>
                    <span class="badge bg-info text-dark" sec:authorize="hasRole('ATENDENTE')">ATENDENTE</span>
                </div>

                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">
                            <i class="bi bi-house"></i><span>&nbsp;Home</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ATENDENTE','GERENTE')">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span>&nbsp;Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span>&nbsp;Pedidos</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                        <a class="nav-link" th:href="@{/auditoria}">
                            <i class="bi bi-journal-text"></i><span>&nbsp;Auditoria</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            <i class="bi bi-gear"></i><span>&nbsp;Configurações</span>
                            <span class="float-end">&#9662;</span> <!-- Setinha -->
                        </a>
                        <ul class="nav flex-column submenu">
                            <!-- Funcionários, Entregadores e Horário de Funcionamento removidos:
                                 vinham no projeto base sem tela/rota implementada (404) e não fazem parte da atividade -->
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/produtos}">
                                    <i class="bi bi-boxes"></i><span>&nbsp;Produtos</span>
                                </a>
                            </li>
                            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                                <a class="nav-link" th:href="@{/usuarios}">
                                    <i class="bi bi-people-fill"></i><span>&nbsp;Usuários</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="nav-item mt-3" sec:authorize="isAuthenticated()">
                        <!-- Logout via POST (protegido por CSRF) -->
                        <form th:action="@{/logout}" method="post" class="px-3">
                            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                                <i class="bi bi-box-arrow-right"></i><span>&nbsp;Sair</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
