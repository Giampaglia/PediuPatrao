<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Apenas controla quais botões aparecem; o backend valida o perfil de qualquer forma -->
    <script th:inline="javascript">
        const PODE_EDITAR = /*[[${#authorization.expression('hasRole(''ATENDENTE'')')}]]*/ false;
        const PODE_EXCLUIR = /*[[${#authorization.expression('hasRole(''GERENTE'')')}]]*/ false;
    </script>
    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function carregarClientes() {
            const resposta = await api(API_URL);
            if (!resposta.ok) {
                tabelaClientes.innerHTML = `<tr><td colspan="4" class="text-danger text-center py-4">Erro ao carregar clientes (${resposta.status}).</td></tr>`;
                return;
            }
            const clientes = resposta.dados;
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const id = encodeURIComponent(cliente.id);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${escapeHtml(cliente.nome || '—')}</td>
                    <td>${escapeHtml(cliente.telefone || '—')}</td>
                    <td>${escapeHtml(formatarEndereco(cliente))}</td>
                    <td class="text-end pe-4">
                        ${PODE_EDITAR ? `<a href="/clientes/editar/${id}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>` : ''}
                        ${PODE_EXCLUIR ? `<button class="btn btn-sm btn-outline-danger" data-excluir="${escapeHtml(cliente.id)}">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>` : ''}
                    </td>
                `;
                tabelaClientes.appendChild(row);
            });
        }

        tabelaClientes.addEventListener('click', e => {
            const botao = e.target.closest('[data-excluir]');
            if (botao) excluirCliente(botao.dataset.excluir);
        });

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const resposta = await api(`${API_URL}/${encodeURIComponent(id)}`, { method: 'DELETE' });
                if (resposta.ok) {
                    alert('Cliente excluído com sucesso!');
                    carregarClientes();
                } else {
                    alert('Erro ao excluir o cliente: ' + ((resposta.dados && resposta.dados.mensagem) || resposta.status));
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
