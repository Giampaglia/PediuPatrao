<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gerenciar Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formularioProduto"
                sec:authorize="hasAnyRole('ADMIN','GERENTE')" onclick="limparFormulario()">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <!-- Formulário de cadastro/edição (ADMIN e GERENTE) -->
    <div class="collapse mb-4" id="formularioProduto" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
        <div class="card card-body shadow-sm" style="max-width: 600px;">
            <form id="produtoForm">
                <input type="hidden" id="produtoId">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome do Produto</label>
                    <input type="text" id="nome" class="form-control" placeholder="Nome do Produto" required>
                </div>
                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo do Produto</label>
                    <select id="tipo" class="form-select" required>
                        <option value="" disabled selected>Selecione o Tipo</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Esfiha">Esfiha</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="preco" class="form-label">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control" step="0.01" min="0.01" required>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" id="ativo" class="form-check-input" checked>
                    <label for="ativo" class="form-check-label">Produto Ativo</label>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary" data-bs-toggle="collapse"
                            data-bs-target="#formularioProduto">Fechar</button>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th class="text-end">Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4" sec:authorize="hasAnyRole('ADMIN','GERENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td class="text-end"
                            th:text="${produto.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td>
                            <span class="badge" th:classappend="${produto.ativo == false} ? 'bg-secondary' : 'bg-success'"
                                  th:text="${produto.ativo == false} ? 'Não' : 'Sim'"></span>
                        </td>
                        <td class="text-end pe-4" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                            <button type="button" class="btn btn-sm btn-outline-primary me-1"
                                    th:attr="data-id=${produto.id},data-nome=${produto.nome},data-tipo=${produto.tipo},data-preco=${produto.preco},data-ativo=${produto.ativo != false}"
                                    onclick="editarProduto(this)">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger"
                                    th:attr="data-id=${produto.id}" onclick="excluirProduto(this.dataset.id)">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function limparFormulario() {
            const form = document.getElementById('produtoForm');
            if (!form) return;
            form.reset();
            document.getElementById('produtoId').value = '';
        }

        function editarProduto(botao) {
            document.getElementById('produtoId').value = botao.dataset.id;
            document.getElementById('nome').value = botao.dataset.nome || '';
            document.getElementById('tipo').value = botao.dataset.tipo || '';
            document.getElementById('preco').value = botao.dataset.preco || '';
            document.getElementById('ativo').checked = botao.dataset.ativo === 'true';
            bootstrap.Collapse.getOrCreateInstance(document.getElementById('formularioProduto')).show();
        }

        async function excluirProduto(id) {
            if (!confirm('Tem certeza que deseja excluir este produto?')) return;
            const resposta = await api('/api/produtos/' + encodeURIComponent(id), { method: 'DELETE' });
            if (resposta.ok) location.reload();
            else alert('Erro ao excluir o produto (' + resposta.status + ').');
        }

        const formProduto = document.getElementById('produtoForm');
        if (formProduto) {
            formProduto.addEventListener('submit', async e => {
                e.preventDefault();
                const id = document.getElementById('produtoId').value;
                const produto = {
                    nome: document.getElementById('nome').value,
                    tipo: document.getElementById('tipo').value,
                    preco: parseFloat(document.getElementById('preco').value),
                    ativo: document.getElementById('ativo').checked
                };
                const resposta = id
                    ? await api('/api/produtos/' + encodeURIComponent(id), { method: 'PUT', body: produto })
                    : await api('/api/produtos', { method: 'POST', body: produto });
                if (resposta.ok) location.reload();
                else alert('Erro ao salvar o produto (' + resposta.status + ').');
            });
        }
    </script>
</div>

</body>
</html>
