# Configurando a conex\u00e3o com MongoDB enquanto reposit\u00f3rio de dados
# A string de conexão (com usuário e senha) não fica no repositório:
# defina a variável de ambiente MONGODB_URI ou crie o arquivo segredos.properties
# na raiz do projeto (modelo em segredos.properties.exemplo; ignorado pelo Git).
spring.config.import=optional:file:./segredos.properties
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=pediupatrao
# Definindo usu\u00e1rio e senha padr\u00e3o para autentica\u00e7\u00e3o de usu\u00e1rio do sistema
#spring.main.allow-circular-references=true
spring.security.user.name=user
spring.security.user.password=shalom

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

# Dashboard: gera ~90 dias de pedidos fictícios para demonstração (somente se houver menos de 50 pedidos).
# Ative ao iniciar: mvnw.cmd spring-boot:run -Dspring-boot.run.arguments=--pediupatrao.demo.gerar-pedidos=true
pediupatrao.demo.gerar-pedidos=false
pediupatrao.demo.dias=90

# Limites de tempo do MongoDB (ms): com o banco fora do ar a API responde 503 em segundos, sem travar
pediupatrao.mongodb.timeout-selecao-ms=5000
pediupatrao.mongodb.timeout-conexao-ms=5000
pediupatrao.mongodb.timeout-leitura-ms=15000